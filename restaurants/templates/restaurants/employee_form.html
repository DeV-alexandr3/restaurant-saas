{% extends "restaurants/base.html" %}

{% block title %}
Novo funcionário
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Novo funcionário</h1>
        <p>Crie o acesso de um funcionário.</p>
    </div>

</div>

<div class="content-card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Senha inicial
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>

        <div class="form-group">

            <label for="role">
                Função
            </label>

            <select
                id="role"
                name="role"
                required
            >

                <option value="EMPLOYEE">
                    Funcionário
                </option>

                <option value="ADMIN">
                    Administrador
                </option>

            </select>

        </div>

        <div class="form-actions">

            <a
                href="{% url 'employee_list' %}"
                class="btn-secondary"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn-primary"
            >
                Criar funcionário
            </button>

        </div>

    </form>

</div>

{% endblock %}
