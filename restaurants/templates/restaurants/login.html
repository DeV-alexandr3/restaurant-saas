{% load static %}

<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar</title>

    <link
        rel="stylesheet"
        href="{% static 'restaurants/css/dashboard.css' %}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <h1>Entrar</h1>

        <p>Acesse o painel do restaurante.</p>

        {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-primary"
            >
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
