{% extends "restaurants/base.html" %}

{% block title %}
    {% if variation %}
        Editar variação
    {% else %}
        Nova variação
    {% endif %}
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>
            {% if variation %}
                Editar variação
            {% else %}
                Nova variação
            {% endif %}
        </h1>
        <p>{{ product.name }}</p>
    </div>
</div>

<div class="content-card">

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Nome da variação</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ variation.name|default:'' }}"
                placeholder="Ex: Grande"
                required
            >
        </div>

        <div class="form-group">
            <label for="price">Preço</label>

            <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                value="{{ variation.price|default:'' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="position">Posição</label>

            <input
                type="number"
                id="position"
                name="position"
                value="0"
                value="{{ variation.position|default:0 }}"
                min="0"
            >
        </div>

        <div class="form-check">
            <input
                type="checkbox"
                id="is_available"
                name="is_available"
                {% if not variation or variation.is_available %}
                    checked
                {% endif %}
            >

            <label for="is_available">
                Variação disponível
            </label>
        </div>

        <div class="form-actions">
            <a
                href="{% url 'product_variation_list' product.id %}"
                class="btn-secondary"
            >
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                 {% if variation %}
                    Salvar alterações
                {% else %}
                    Salvar variação
                {% endif %}
            </button>
        </div>

    </form>

</div>

{% endblock %}
